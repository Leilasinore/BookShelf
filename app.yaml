apiVersion: apps/v1
kind: Deployment
metadata:
  name: storebe-deployment
  labels:
    app: storebe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storebe
  template:
    metadata:
      labels:
        app: storebe
    spec:
      containers:
        - name: storebe
          image: leilasinore/storebe:v1
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-url
            - name: DB_PORT
              value: "5432"
          

---
apiVersion: v1
kind: Service
metadata:
  name: storebe-service
spec:
  selector:
    app: storebe
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000